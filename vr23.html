<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #drag-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 80px;
      z-index: 50;
      cursor: grab;
      display: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #drag-layer:active {
      cursor: grabbing;
    }
    #status-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd54f;
      border: 1px solid rgba(255, 213, 79, 0.5);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 75vw;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status-badge">유튜브 API 불러오는 중...</div>
  <div id="drag-layer"></div>
  <div id="player"></div>

  <script>
    var badge = document.getElementById('status-badge');
    var dragLayer = document.getElementById('drag-layer');
    var player;
    var playerCreated = false;
    var isDragging = false;
    var wasDragged = false;
    var downX = 0, downY = 0;
    var startX = 0, startY = 0;
    var yaw = 0, pitch = 0, fov = 100;
    var sphericalSynced = false;

    if (window.location.protocol === 'file:') {
      badge.innerHTML = '⚠️ 현재 로컬 파일(file://)로 열려 있습니다.<br>로컬 서버(http://localhost)나 웹 호스팅에 올려야 영상이 나옵니다.';
    }

    function handleApiLoadError() {
      badge.innerHTML = '❌ 유튜브 API 스크립트가 차단되었습니다.<br>브라우저 추적 방지·광고 차단을 해제한 뒤 새로고침해 주세요.';
    }

    function initYouTubePlayer() {
      if (playerCreated) return;
      if (!window.YT || !window.YT.Player) return;
      playerCreated = true;

      badge.textContent = '플레이어 생성 중...';

      var vars = {
        'autoplay': 1,
        'mute': 0,
        'start': 0,
        'fs': 1,
        'playsinline': 1,
        'rel': 0
      };
      if (window.location.protocol.indexOf('http') === 0) {
        vars.origin = window.location.origin;
      }

      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'HgYWmgxCtrM',
        playerVars: vars,
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    window.onYouTubeIframeAPIReady = initYouTubePlayer;

    var apiCheckCount = 0;
    var apiWatcher = setInterval(function() {
      apiCheckCount++;
      if (window.YT && window.YT.Player) {
        clearInterval(apiWatcher);
        initYouTubePlayer();
      } else if (apiCheckCount >= 25) {
        clearInterval(apiWatcher);
        badge.innerHTML = '⚠️ 유튜브 API 응답이 지연되고 있습니다. 새로고침해 주세요.';
      }
    }, 200);

    function onPlayerReady(event) {
      dragLayer.style.display = 'block';
      event.target.unMute();
      event.target.setVolume(100);
      event.target.playVideo();

      // 임베드 환경에서 브라우저가 소리 있는 자동재생을 막은 경우 무음으로 즉시 재생 시작
      setTimeout(function() {
        if (!player || typeof player.getPlayerState !== 'function') return;
        var state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
          player.mute();
          player.playVideo();
          badge.style.display = 'block';
          badge.textContent = '🔊 화면을 클릭하거나 방향키를 누르면 소리가 켜집니다';
          setTimeout(function() { badge.style.display = 'none'; }, 3500);
        }
      }, 450);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        syncSphericalProperties();
        if (player && typeof player.isMuted === 'function' && !player.isMuted()) {
          badge.style.display = 'none';
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        badge.style.display = 'block';
        badge.textContent = '일시정지 상태입니다. 화면을 클릭하면 재생됩니다.';
      } else if (event.data === YT.PlayerState.BUFFERING) {
        badge.textContent = '영상 버퍼링 중...';
      }
    }

    function onPlayerError(event) {
      var msg = {
        2: '잘못된 영상 ID입니다.',
        5: 'HTML5 플레이어 렌더링 오류입니다.',
        100: '삭제되었거나 비공개 영상입니다.',
        101: '게시자가 외부 사이트 재생(퍼가기)을 막은 영상입니다.',
        150: '게시자가 외부 사이트 재생(퍼가기)을 막은 영상입니다.',
        153: '출처(Referer/Origin) 설정 오류입니다. 웹 서버(http/https)에서 열어주세요.'
      }[event.data] || '알 수 없는 재생 오류';
      badge.style.display = 'block';
      badge.innerHTML = '❌ 유튜브 오류 코드 ' + event.data + '<br>' + msg;
    }

    function syncSphericalProperties() {
      var tries = 0;
      var timer = setInterval(function() {
        tries++;
        if (!player || typeof player.getSphericalProperties !== 'function') {
          clearInterval(timer);
          return;
        }
        try {
          var props = player.getSphericalProperties();
          if (props && typeof props.yaw === 'number') {
            if (!sphericalSynced) {
              yaw = props.yaw;
              pitch = props.pitch || 0;
              fov = props.fov || 100;
              player.setSphericalProperties({ enableOrientationSensor: true });
              sphericalSynced = true;
            }
            clearInterval(timer);
          }
        } catch (err) {}
        if (tries >= 15) clearInterval(timer);
      }, 400);
    }

    function unmuteAndFocus() {
      try { window.focus(); } catch (e) {}
      if (!player) return;
      try {
        if (typeof player.unMute === 'function') {
          player.unMute();
          player.setVolume(100);
        }
      } catch (e) {}
    }

    dragLayer.addEventListener('mouseenter', function() {
      try { window.focus(); } catch (e) {}
    });

    // 드래그 시점 제어 (10px 이하 움직임은 클릭으로 판정)
    function startDrag(x, y) {
      unmuteAndFocus();
      isDragging = true;
      wasDragged = false;
      downX = x;
      downY = y;
      startX = x;
      startY = y;
      try {
        var props = player.getSphericalProperties();
        if (props && typeof props.yaw === 'number') {
          yaw = props.yaw;
          pitch = props.pitch;
          fov = props.fov || fov;
        }
      } catch (err) {}
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
      if (Math.abs(x - downX) > 10 || Math.abs(y - downY) > 10) {
        wasDragged = true;
      }
      var dx = x - startX;
      var dy = y - startY;
      startX = x;
      startY = y;

      if (!wasDragged) return;
      yaw = (yaw - dx * 0.25 + 360) % 360;
      pitch = Math.max(-90, Math.min(90, pitch + dy * 0.25));
      try {
        player.setSphericalProperties({ yaw: yaw, pitch: pitch, fov: fov });
      } catch (err) {}
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
    }

    dragLayer.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function(e) { moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup', endDrag);

    // 클릭 시 소리 활성화 및 재생/일시정지 전환
    dragLayer.addEventListener('click', function() {
      if (wasDragged) {
        wasDragged = false;
        return;
      }
      if (!player || typeof player.getPlayerState !== 'function') return;

      var wasMuted = (typeof player.isMuted === 'function' && player.isMuted());
      var state = player.getPlayerState();

      unmuteAndFocus();
      badge.style.display = 'none';

      // 무음 자동재생 상태에서 첫 클릭 시: 일시정지하지 않고 소리만 즉시 켬
      if (state === YT.PlayerState.PLAYING && wasMuted) {
        return;
      }

      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    // 터치 드래그 및 탭 제어
    dragLayer.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    dragLayer.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    dragLayer.addEventListener('touchend', function(e) {
      var dragged = wasDragged;
      endDrag();
      if (!dragged && player && typeof player.getPlayerState === 'function') {
        if (e.cancelable) e.preventDefault();
        var wasMuted = (typeof player.isMuted === 'function' && player.isMuted());
        var state = player.getPlayerState();
        unmuteAndFocus();
        badge.style.display = 'none';
        if (state === YT.PlayerState.PLAYING && wasMuted) return;
        if (state === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      }
    });

    dragLayer.addEventListener('wheel', function(e) {
      e.preventDefault();
      unmuteAndFocus();
      fov = Math.max(30, Math.min(120, fov + e.deltaY * 0.05));
      try {
        player.setSphericalProperties({ fov: fov });
      } catch (err) {}
    }, { passive: false });

    // 키보드 방향키(상하좌우) 및 +/- (확대/축소) 제어
    var keyState = {};
    var keyTimer = null;

    function normalizeKey(e) {
      if (e.code === 'Equal' || e.code === 'NumpadAdd') return '+';
      if (e.code === 'Minus' || e.code === 'NumpadSubtract') return '-';
      if (e.key === '=' || e.key === '+') return '+';
      if (e.key === '_' || e.key === '-') return '-';
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) !== -1) return e.key;
      return null;
    }

    function
