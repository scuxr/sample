<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>VR 360° YouTube Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:14px system-ui,-apple-system,'Malgun Gothic',sans-serif;overflow:hidden}
#player{position:absolute;inset:0;width:100%;height:100%;border:0}
#drag{position:absolute;inset:0 0 82px;cursor:grab;touch-action:none;user-select:none;outline:none}#drag.dragging{cursor:grabbing}
#bar{position:absolute;bottom:0;left:0;right:0;min-height:76px;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.93) 25%);z-index:10}
button{font:inherit;color:white;background:#292c34;border:1px solid #5a5d66;border-radius:7px;padding:10px 13px;cursor:pointer;min-height:38px}button:hover{background:#414754}button:focus-visible,input:focus-visible{outline:2px solid #6bb5ff}button:disabled{opacity:.45;cursor:not-allowed}#play{background:#1769bb;border-color:#3587d9;min-width:96px}#sound{min-width:94px}#time{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}#seek{flex:1 1 130px;min-width:75px}#vol{width:85px;accent-color:#68b5ff}#status{font-size:12px;color:#e5e5e5;white-space:nowrap}#notice{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);background:rgba(0,0,0,.76);border-radius:8px;padding:10px 14px;text-align:center;pointer-events:none;z-index:8;font-size:13px}input{accent-color:#68b5ff}
@media(max-width:640px){#bar{gap:6px;padding:8px}button{padding:8px}#vol{width:55px}#time{font-size:11px}#status{display:none}#drag{bottom:98px}}
</style>
</head>
<body>
<div id="player"></div>
<div id="drag" tabindex="0" title="드래그: 시점 이동 / 마우스 휠: 확대 축소"></div>
<div id="notice">영상 준비 중 · 소리를 들으려면 아래 '소리 켜기'를 누르세요.</div>
<div id="bar" aria-label="360도 동영상 컨트롤">
  <button id="play" disabled>▶ 재생</button>
  <button id="sound" disabled>🔊 소리 켜기</button>
  <input id="vol" type="range" min="0" max="100" value="80" aria-label="음량" title="음량">
  <span id="time">00:00 / 00:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" title="재생 위치">
  <button id="reset" disabled title="정면으로 시점 초기화">⟲ 시점</button>
  <button id="full" title="전체 화면">⛶ 전체화면</button>
  <span id="status">연결 중</span>
</div>
<script>
'use strict';
const VIDEO_ID='HgYWmgxCtrM';
const el=id=>document.getElementById(id);
let player=null,ready=false,playing=false,muted=true,seekDragging=false;
let yaw=0,pitch=0,fov=100,dragging=false,dragMoved=false,startX=0,startY=0;
function status(msg){el('status').textContent=msg}
function notice(msg){el('notice').textContent=msg;el('notice').hidden=!msg}
function fmt(t){if(!Number.isFinite(t))return '00:00';t=Math.max(0,Math.floor(t));return (Math.floor(t/3600)?String(Math.floor(t/3600)).padStart(2,'0')+':':'')+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function syncPlay(){if(!ready)return;const s=player.getPlayerState();playing=s===YT.PlayerState.PLAYING;el('play').textContent=playing?'⏸ 일시정지':'▶ 재생';status(playing?'재생 중':s===YT.PlayerState.BUFFERING?'버퍼링 중':s===YT.PlayerState.PAUSED?'일시정지':s===YT.PlayerState.ENDED?'재생 종료':'준비 완료')}
function syncSound(){if(!ready)return;muted=player.isMuted();el('sound').textContent=muted?'🔊 소리 켜기':'🔇 음소거';}
function applySphere(){if(!ready||!player.setSphericalProperties)return;player.setSphericalProperties({yaw,pitch,fov,enableOrientationSensor:false})}
function playToggle(){if(!ready)return;const s=player.getPlayerState();if(s===YT.PlayerState.PLAYING){player.pauseVideo()}else{player.playVideo()}}
function soundToggle(){if(!ready)return;if(player.isMuted()){player.unMute();player.setVolume(Number(el('vol').value)||80)}else{player.mute()}setTimeout(syncSound,150)}
function onYouTubeIframeAPIReady(){
 player=new YT.Player('player',{width:'100%',height:'100%',videoId:VIDEO_ID,playerVars:{autoplay:1,mute:1,controls:0,playsinline:1,rel:0,fs:1,enablejsapi:1,origin:(location.protocol==='http:'||location.protocol==='https:')?location.origin:undefined},events:{
  onReady(e){ready=true;['play','sound','reset'].forEach(id=>el(id).disabled=false);e.target.setVolume(80);e.target.mute();syncPlay();syncSound();notice('영상 위에서 드래그하여 360° 시점을 이동할 수 있습니다. 소리는 아래 버튼을 누르세요.');status('준비 완료')},
  onStateChange(){syncPlay()},
  onError(e){notice('유튜브 재생 오류 ('+e.data+'). 영상의 임베드 허용 여부와 주소를 확인하세요.');status('재생 오류')},
  onAutoplayBlocked(){notice('브라우저가 자동재생을 차단했습니다. 아래 재생 버튼을 누르세요.');status('자동재생 제한')}
 }});
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>{notice('YouTube API 스크립트 로딩 실패. 네트워크 또는 콘텐츠 보안 정책을 확인하세요.');status('연결 실패')};document.head.appendChild(script);
el('play').addEventListener('click',playToggle);
el('sound').addEventListener('click',soundToggle);
el('vol').addEventListener('input',()=>{if(!ready)return;player.setVolume(Number(el('vol').value));if(Number(el('vol').value)>0&&player.isMuted())player.unMute();syncSound()});
el('seek').addEventListener('pointerdown',()=>seekDragging=true);
el('seek').addEventListener('input',()=>{if(!ready)return;const d=player.getDuration();el('time').textContent=fmt(d*Number(el('seek').value)/1000)+' / '+fmt(d)});
el('seek').addEventListener('change',()=>{if(!ready)return;const d=player.getDuration();if(d>0)player.seekTo(d*Number(el('seek').value)/1000,true);seekDragging=false});
el('seek').addEventListener('pointerup',()=>seekDragging=false);
el('reset').addEventListener('click',()=>{yaw=0;pitch=0;fov=100;applySphere()});
el('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>status('전체화면 사용 불가: 상위 iframe의 fullscreen 허용 여부 확인'))}});
const drag=el('drag');
drag.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;dragMoved=false;startX=e.clientX;startY=e.clientY;drag.classList.add('dragging');drag.setPointerCapture(e.pointerId)});
drag.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;startX=e.clientX;startY=e.clientY;if(Math.abs(dx)+Math.abs(dy)>0)dragMoved=true;yaw=((yaw-dx*.28)%360+360)%360;pitch=Math.min(90,Math.max(-90,pitch+dy*.28));applySphere()});
drag.addEventListener('pointerup',()=>{dragging=false;drag.classList.remove('dragging')});
drag.addEventListener('pointercancel',()=>{dragging=false;drag.classList.remove('dragging')});
drag.addEventListener('wheel',e=>{e.preventDefault();fov=Math.min(120,Math.max(30,fov+e.deltaY*.05));applySphere()},{passive:false});
drag.addEventListener('keydown',e=>{const step=4;if(e.key==='ArrowLeft')yaw+=step;else if(e.key==='ArrowRight')yaw-=step;else if(e.key==='ArrowUp')pitch=Math.min(90,pitch+step);else if(e.key==='ArrowDown')pitch=Math.max(-90,pitch-step);else if(e.key==='+'||e.key==='=')fov=Math.max(30,fov-3);else if(e.key==='-')fov=Math.min(120,fov+3);else if(e.key===' '){e.preventDefault();playToggle();return}else return;e.preventDefault();applySphere()});
setInterval(()=>{if(!ready)return;try{syncPlay();syncSound();if(!seekDragging){const d=player.getDuration()||0,t=player.getCurrentTime()||0;el('time').textContent=fmt(t)+' / '+fmt(d);el('seek').value=d>0?Math.round(t/d*1000):0}}catch(e){}},500);
</script>
</body>
</html>
