// Body-local coordinates are [r, f, z] in cm: r to the dancer's right, f forward, z up, floor at z = 0.

const BODY = { hipW: 9, thigh: 43, shin: 42, foot: 17, ankle: 7, waist: 17, chest: 31, neck: 8, head: 11, shoulderW: 17, upper: 27, fore: 25 };

// A limb direction: e is the angle from straight down (90 = horizontal), phi the heading on the floor

const RAD = Math.PI / 180;
function dirOf([e, phi], side) {

const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];

// First position, arms low: where every segment starts and ends.

  L: { thigh: [3, 90], shin: [3, 90], foot: [66, 55] },
  RA: { upper: [18, 25], fore: [42, -70] },
  LA: { upper: [18, 25], fore: [42, -70] },

// One segment of the VX clip: 1.0 s in first position, 1.6 s into the pose, 1.6 s held, 1.4 s back.
const PHASES = [1.0, 1.6, 1.6, 1.4];
const PERIOD = PHASES.reduce((a, b) => a + b, 0);
const CLIP = SEGMENTS.length * PERIOD; // the whole VX clip, in seconds

const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
// How far into the pose the professional is, 0..1, at time t inside a segment.
function weightAt(t) {
  const [a, b, c] = PHASES;
  const u = ((t % PERIOD) + PERIOD) % PERIOD;
  if (u < a) return 0;
  if (u < a + b) return ease((u - a) / b);
  if (u < a + b + c) return 1;
  return 1 - ease((u - a - b - c) / PHASES[3]);
}

// A pose as a flat list of numbers, so poses can be eased and followed component by component.
const LIMBS = [["R", "thigh"], ["R", "shin"], ["R", "foot"], ["L", "thigh"], ["L", "shin"], ["L", "foot"], ["RA", "upper"], ["RA", "fore"], ["LA", "upper"], ["LA", "fore"]];
function flatten(pose) {
  const out = [pose.tilt];
  for (const [g, k] of LIMBS) out.push(pose[g][k][0], pose[g][k][1]);
  out.push(pose.roll || 0, pose.nod || 0);
  return out;
}
function unflatten(v) {
  const pose = { tilt: v[0], R: {}, L: {}, RA: {}, LA: {} };
  LIMBS.forEach(([g, k], i) => (pose[g][k] = [v[1 + i * 2], v[2 + i * 2]]));
  pose.roll = v[1 + LIMBS.length * 2] || 0;
  pose.nod = v[2 + LIMBS.length * 2] || 0;
  return pose;
}
const PREP_FLAT = flatten(PREP);
const SEG_FLAT = SEGMENTS.map((s) => flatten(s.pose));
function poseAt(segment, t) {
  const w = weightAt(t);
  const target = SEG_FLAT[segment];
  return PREP_FLAT.map((v, i) => v + (target[i] - v) * w);
}

// Forward kinematics: joints in body-local [r, f, z], lifted so the lower ankle sits at ankle height.
function skeleton(flat) {
  const pose = unflatten(flat);
  const B = BODY;
  const t = pose.tilt * RAD;
  // Upper body: lean forward by tilt, then drop the right shoulder by roll (both about the pelvis).
  const q = pose.roll * RAD;
  const rot = ([r, f, z]) => {
    const f1 = f * Math.cos(t) + z * Math.sin(t), z1 = -f * Math.sin(t) + z * Math.cos(t);
    return [r * Math.cos(q) + z1 * Math.sin(q), f1, -r * Math.sin(q) + z1 * Math.cos(q)];
  };
  const J = { pelvis: [0, 0, 0] };
  for (const [key, side] of [["R", 1], ["L", -1]]) {
    const hip = [side * B.hipW, 0, 0];
    const knee = add(hip, dirOf(pose[key].thigh, side), B.thigh);
    const ankle = add(knee, dirOf(pose[key].shin, side), B.shin);
    const toe = add(ankle, dirOf(pose[key].foot, side), B.foot);
    Object.assign(J, { ["hip" + key]: hip, ["knee" + key]: knee, ["ankle" + key]: ankle, ["toe" + key]: toe });
  }
  J.waist = rot([0, 0, B.waist]);
  J.chest = rot([0, 0, B.waist + B.chest]);
  J.neck = rot([0, 0, B.waist + B.chest + B.neck]);
  const n = pose.nod * RAD;
  J.head = rot([0, Math.sin(n) * B.head, B.waist + B.chest + B.neck + Math.cos(n) * B.head]);
  for (const [key, side] of [["RA", 1], ["LA", -1]]) {
    const shoulder = rot([side * B.shoulderW, 0, B.waist + B.chest - 4]);
    const elbow = add(shoulder, rot(dirOf(pose[key].upper, side)), B.upper);
    const wrist = add(elbow, rot(dirOf(pose[key].fore, side)), B.fore);
    const s = key[0];
    Object.assign(J, { ["shoulder" + s]: shoulder, ["elbow" + s]: elbow, ["wrist" + s]: wrist });
  }
  const lift = B.ankle - Math.min(J.ankleR[2], J.ankleL[2]);
  for (const name in J) J[name] = [J[name][0], J[name][1], J[name][2] + lift];
  return J;
}

// The limbs drawn, as [from, to, radius in cm].
const BONES = [
  ["hipR", "kneeR", 6.2], ["kneeR", "ankleR", 4.6], ["ankleR", "toeR", 3],
  ["hipL", "kneeL", 6.2], ["kneeL", "ankleL", 4.6], ["ankleL", "toeL", 3],
  ["hipL", "hipR", 8.5], ["pelvis", "waist", 8], ["waist", "chest", 11.5], ["chest", "neck", 3.6],
  ["shoulderL", "shoulderR", 5], ["shoulderR", "elbowR", 3.6], ["elbowR", "wristR", 3], ["shoulderL", "elbowL", 3.6], ["elbowL", "wristL", 3],
];
const BALLS = [["kneeR", 5], ["kneeL", 5], ["elbowR", 3.6], ["elbowL", 3.6], ["shoulderR", 5.2], ["shoulderL", 5.2], ["ankleR", 3.8], ["ankleL", 3.8], ["wristR", 3.2], ["wristL", 3.2]];
const HEAD_R = BODY.head;

// A camera looking at the dancer from heading `yaw` (degrees from straight in front, positive toward her right),
// as a mirror shows it: her right on the viewer's right. Returns [x, y] in cm, y up from the floor.
function mirrorView([r, f, z], yaw) {
  const a = yaw * RAD;
  return [r * Math.cos(a) - f * Math.sin(a), z];
}

// How the learner follows the projected demonstration: an exponential lag on every joint angle.
const LAG = 0.38; // seconds

// ---------- model walking (공간확장 모듈) ----------
// A catwalk step cycle. phase 0..1 is one full stride (two steps). style sets how the walk is carried:
// stride (thigh swing, degrees), tilt (hunch forward), roll (right shoulder drop), nod (head down), arms (swing ratio).
const WALK_STYLES = {
  past: { stride: 15, tilt: 9, roll: 6, nod: 24, arms: 0.25, bend: 22 },
  now: { stride: 23, tilt: -2, roll: 0, nod: -4, arms: 0.55, bend: 14 },
};
const swingOf = (deg) => [Math.abs(deg), deg >= 0 ? 0 : 180];
function walkPose(phase, style) {
  const a = phase * Math.PI * 2;
  const s = Math.sin(a);
  const legs = {};
  for (const [key, sign, off] of [["R", 1, 0], ["L", -1, Math.PI]]) {
    const th = style.stride * Math.sin(a + off);
    // The knee folds while the leg swings through (the half cycle after it leaves the floor behind).
    const fold = style.bend * Math.max(0, Math.sin(a + off + 1.1));
    legs[key] = { thigh: swingOf(th), shin: swingOf(th - fold), foot: [th > 4 ? 78 : 68, th > 4 ? 0 : 4] };
    void sign;
  }
  const arm = (off) => {
    const al = -style.stride * style.arms * Math.sin(a + off);
    return { upper: swingOf(al + 3), fore: swingOf(al + 12) };
  };
  return flatten({ tilt: style.tilt, roll: style.roll, nod: style.nod, R: legs.R, L: legs.L, RA: arm(0), LA: arm(Math.PI) });
  void s;
}

// Drawing the dancer. Pure: no imports. The build passes the kit's iso/depthOf; the page uses the kit's globals.
// Needs model.mjs (BONES, BALLS, HEAD_R, mirrorView) in scope when inlined; the build strips this import line.


const dnF = (v) => (Math.round(v * 10) / 10).toString();
const dnPt = (p) => dnF(p[0]) + " " + dnF(p[1]);

// The kit light (from the left and above) as a screen direction.
const DN_LIGHT = (() => { const l = [-1, -0.62]; const n = Math.hypot(l[0], l[1]); return [l[0] / n, l[1] / n]; })();

function dnCapsule(a, b, s) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  if (L < 0.05) return dnCircle(a, s);
  const nx = (-dy / L) * s, ny = (dx / L) * s;
  const r = dnF(s);
  return "M" + dnPt([a[0] + nx, a[1] + ny]) + "L" + dnPt([b[0] + nx, b[1] + ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([b[0] - nx, b[1] - ny]) +
    "L" + dnPt([a[0] - nx, a[1] - ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([a[0] + nx, a[1] + ny]) + "Z";
}
function dnCircle(c, s) {
  const r = dnF(s);
  return "M" + dnPt([c[0] - s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] + s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] - s, c[1]]) + "Z";
}
// Offset across a capsule toward the light, as a screen vector of unit length (or less when the light runs along it).
function dnSide(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  const along = DN_LIGHT[0] * ux + DN_LIGHT[1] * uy;
  return [DN_LIGHT[0] - along * ux, DN_LIGHT[1] - along * uy];
}

// A turned-wood mannequin: every limb a capsule, every joint a ball, sorted far to near.
// place: [X, Y] world position of the pelvis on the floor; the dancer faces -y, so her right is -x.
// extras: [{ at: world point, svg }] sorted in with the body parts (a headset, a phone, a microphone).
function mannequinSvg(J, place, P, isoFn, depthFn, heading = 0, lift = 0, extras = []) {
  // Screen px per world unit: a ball of radius r projects to a circle of radius r * scale.
  const scale = Math.abs(isoFn([0, 0, 1], P)[1] - isoFn([0, 0, 0], P)[1]) / Math.cos(((P.elevation || 30) * Math.PI) / 180);
  // heading 0 faces -y (her right is -x); positive turns her toward +x.
  const h = (heading * Math.PI) / 180;
  const fw = [Math.sin(h), -Math.cos(h)], rt = [-Math.cos(h), -Math.sin(h)];
  const world = (p) => [place[0] + p[0] * rt[0] + p[1] * fw[0], place[1] + p[0] * rt[1] + p[1] * fw[1], p[2] + lift];
  const items = [];
  for (const [from, to, r] of BONES) {
    const A = world(J[from]), B = world(J[to]);
    const a = isoFn(A, P), b = isoFn(B, P), s = r * scale;
    const mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2, (A[2] + B[2]) / 2];
    const side = dnSide(a, b);
    const offs = (p, t) => [p[0] + side[0] * s * t, p[1] + side[1] * s * t];
    const body = dnCapsule(a, b, s);
    const shine = dnCapsule(offs(a, 0.42), offs(b, 0.42), s * 0.42);
    const shade = dnCapsule(offs(a, -0.5), offs(b, -0.5), s * 0.42);
    items.push([depthFn(mid, P), '<g class="mq-part"><path class="mq-body" d="' + body + '"/><path class="mq-shade" d="' + shade + '"/><path class="mq-shine" d="' + shine + '"/><path class="mq-edge" d="' + body + '"/></g>']);
  }

    const dk = [c[0] - DN_LIGHT[0] * s * 0.42, c[1] - DN_LIGHT[1] * s * 0.42];
    items.push([depthFn(C, P) + bias, '<g class="mq-part"><path class="mq-body" d="' + dnCircle(c, s) + '"/><path class="mq-shade" d="' + dnCircle(dk, s * 0.5) + '"/><path class="mq-shine" d="' + dnCircle(sh, s * 0.5) + '"/><path class="mq-edge" d="' + dnCircle(c, s) + '"/></g>']);
  };
  for (const [name, r] of BALLS) ball(world(J[name]), r, 0.6);
  const head = world(J.head);
  ball(head, HEAD_R, 0.4);
  // A bun at the back of the head: behind it and a little up.
  const neck = world(J.neck);
  const up = [head[0] - neck[0], head[1] - neck[1], head[2] - neck[2]];
  const n = Math.hypot(up[0], up[1], up[2]) || 1;
  ball([head[0] - fw[0] * 7.5 + up[0] / n * 6, head[1] - fw[1] * 7.5 + up[1] / n * 6, head[2] + up[2] / n * 6 - 1], 4.6, 0.8);
  for (const e of extras) items.push([depthFn(e.at, P) + (e.bias || 0), e.svg]);
  items.sort((p, q) => p[0] - q[0]);
  return items.map((item) => item[1]).join("");
}

// The dancer as a video shows her on a panel face, in the face plane's own coordinates (u along world x, v = -z).
// mirror: true shows her right on the viewer's right. cx: the panel centre in world x. floor: the image's floor height.
function screenFigureSvg(J, { yaw = 0, mirror = true, cx: centre = 0, shift = 0, floor = 0, scale = 1, cls = "vx" }) {
  const cx = centre + shift;
  const a = (yaw * Math.PI) / 180;
  const toward = (p) => p[0] * Math.sin(a) + p[1] * Math.cos(a);
  const at = (p) => {
    const [mx, my] = mirrorView(p, yaw);
    const x = mirror ? mx : -mx;
    return [cx - x * scale, -(floor + my * scale)];
  };
  // A lit rim round the whole silhouette (every rim under every body), and the limbs on the far side a shade darker,
  // so the two legs and arms read apart without drawing lines inside the figure.
  const rim = 1.1 * scale;
  const mid = toward(J.pelvis);
  const rims = [], parts = [];
  for (const [from, to, r] of BONES) {
    const p = at(J[from]), q = at(J[to]);
    const d = "M" + dnPt(p) + "L" + dnPt(q);
    const depthOf2 = (toward(J[from]) + toward(J[to])) / 2;
    const far = depthOf2 < mid - 4 && from !== "pelvis" && from !== "waist" ? ' class="' + cls + '-far"' : "";
    rims.push('<path class="' + cls + '-rim" d="' + d + '" stroke-width="' + dnF(r * 2 * scale + rim) + '"/>');
    parts.push([depthOf2, '<path' + far + ' d="' + d + '" stroke-width="' + dnF(r * 2 * scale - rim * 0.4) + '"/>']);
  }
  const head = at(J.head);
  rims.push('<circle class="' + cls + '-rim" cx="' + dnF(head[0]) + '" cy="' + dnF(head[1]) + '" r="' + dnF(HEAD_R * scale + rim / 2) + '"/>');
  parts.push([toward(J.head), '<circle class="' + cls + '-head" cx="' + dnF(head[0]) + '" cy="' + dnF(head[1]) + '" r="' + dnF(HEAD_R * scale - rim * 0.2) + '"/>']);
  parts.sort((p, q) => p[0] - q[0]);
  // A soft contact shadow under the feet in the video.
  const feet = [at(J.toeR), at(J.toeL), at(J.ankleR), at(J.ankleL)].filter((p) => -p[1] < floor + 14 * scale);
  const xs = feet.length ? feet.map((p) => p[0]) : [cx];
  const sx0 = Math.min(...xs) - 10 * scale, sx1 = Math.max(...xs) + 10 * scale;
  const shadow = '<ellipse class="' + cls + '-floor" cx="' + dnF((sx0 + sx1) / 2) + '" cy="' + dnF(-floor) + '" rx="' + dnF((sx1 - sx0) / 2) + '" ry="' + dnF(3.2 * scale) + '"/>';
  return shadow + '<g class="' + cls + '-limbs">' + rims.join("") + parts.map((p) => p[1]).join("") + "</g>";
}

// The golf swing, the ball and the four screens. Pure: no imports; inlined into the page after model/dancer.
// Body-local coordinates as model.mjs: [r, f, z] cm, r to the golfer's right, f toward the ball, z up.
// Needs mirrorView, screenFigureSvg (dancer.mjs) in scope.



const GD = Math.PI / 180;
const gAdd = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const gSub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const gLen = (a) => Math.hypot(a[0], a[1], a[2]);
const gUnit = (a) => { const n = gLen(a) || 1; return [a[0] / n, a[1] / n, a[2] / n]; };
const gLerp = (a, b, t) => a + (b - a) * t;
const gEase = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

const BALL_LOCAL = [-3, 62, 2.2];
const CLUB_LEN = 108;
// Swing keys: hand angle on the arc (deg, + toward the right side and up), wrist hinge, shoulder turn, hip turn, weight shift.
const KEYS = {
  address: { a: 0, hinge: 0, turn: 0, hip: 0, shift: 0, heel: 0 },
  top: { a: 150, hinge: 110, turn: 88, hip: 40, shift: 4, heel: 0 },
  impact: { a: 0, hinge: 0, turn: -18, hip: -38, shift: -7, heel: 0.3 },
  finish: { a: -176, hinge: -78, turn: -96, hip: -82, shift: -13, heel: 1 },
};
function mixKeys(a, b, t) {
  const o = {};
  for (const k in a) o[k] = gLerp(a[k], b[k], t);
  return o;
}
// Where the swing is at a moment: phase in "address" | "back" (u 0..1 of the backswing reached) | "down" | "follow" | "finish" | "return".
function swingKey(phase, u, topU = 1) {
  const top = mixKeys(KEYS.address, KEYS.top, topU);
  if (phase === "address") return KEYS.address;
  if (phase === "back") return mixKeys(KEYS.address, KEYS.top, gEase(u) * topU);
  if (phase === "down") return mixKeys(top, KEYS.impact, u * u);
  if (phase === "follow") return mixKeys(KEYS.impact, KEYS.finish, gEase(u));
  if (phase === "finish") return KEYS.finish;
  return mixKeys(KEYS.finish, KEYS.address, gEase(u));
}

// The golfer's joints and club for a swing key.
function golferJoints(K) {

  const pelvis = [K.shift, -8, 84];

  const floorY = r.y1 - 4;
  const bg = '<path class="cv-wall" d="M' + r.x0 + " " + r.y0 + "H" + r.x1 + "V" + floorY.toFixed(1) + "H" + r.x0 + 'Z"/><path class="cv-mat" d="M' + r.x0 + " " + floorY.toFixed(1) + "H" + r.x1 + "V" + r.y1 + "H" + r.x0 + 'Z"/>';
  // i 0: face-on, from in front of the golfer (yaw 0); i 1: down the line, from behind him on the target line (yaw 90).
  return bg + cameraView(J, club, BALL_LOCAL, ballOnTee(), { yaw: i === 0 ? 0 : 90, cx: i === 0 ? cx : cx + 4, floor: -floorY, scale: (r.y1 - r.y0 - 8) / 235, cls: "cv" });
}
function draw() {
  const key = currentKey();

  const d = depthOf([GOLFER.at[0], GOLFER.at[1], 0], P);
  const before = slots.find((s) => s.depth > d);
  if (golferEl.nextSibling !== (before ? before.el : null)) layer.insertBefore(golferEl, before ? before.el : null);
  const showFeedback = feedbackT >= 0 && feedbackT < 5.5;

  const de = depthOf([EXPERT.at[0], EXPERT.at[1], 0], P);
  const be = slots.find((s) => s.depth > de);
  if (expertEl.nextSibling !== (be ? be.el : null)) layer.insertBefore(expertEl, be ? be.el : null);
  roomBallEl.innerHTML = roomBall();
  // Screens.
  const f = flightState();
  impactEl.innerHTML = rangeView(SCREEN_R, f.ball, f.trail);
  monEls[0].innerHTML = cameraScreen(J, club, 0);
  monEls[1].innerHTML = cameraScreen(J, club, 1);
  monEls[2].innerHTML = rangeView(MON_R[2], f.ball, f.trail, { markers: false });
  monEls[3].innerHTML = statsView({ ...MON_R[3], y0: MON_R[3].y0 + 8 }, history.slice(-14), shot && flightT >= 0 ? shot : null, f.s, statLabels());
  // Subtitle: the expert's words on the face-on video.
  if (showFeedback) {
    subText.textContent = feedback;
    const w = Math.min(MON_R[0].x1 - MON_R[0].x0 - 4, subText.getComputedTextLength() + 4);
    const cx = (MON_R[0].x0 + MON_R[0].x1) / 2, y = MON_R[0].y1 - 8;
    subBg.setAttribute("d", "M" + (cx - w / 2).toFixed(1) + " " + y + "h" + w.toFixed(1) + "v5h" + (-w).toFixed(1) + "Z");
  } else { subText.textContent = ""; subBg.setAttribute("d", ""); }
  // Readout.
  let text;
  if (phase === "back") text = "백스윙 " + Math.round(Math.min(1, hold / TOP_T) * 100) + "%" + (hold > TOP_T + 0.12 ? " · 탑에서 너무 오래 멈춤" : "");
  else if (showFeedback && shot) text = "전문가: " + feedback;
  else if (shot && flightT >= 0) text = "캐리 " + Math.round(shot.carry) + " m · 볼 스피드 " + Math.round(shot.ball) + " mph · " + (shot.side >= 0 ? "오른쪽 " : "왼쪽 ") + Math.abs(Math.round(shot.side)) + " m";
  else text = "어드레스 · 스페이스나 마우스를 누르고 있다가 떼면 스윙";
  if (readout.textContent !== text) readout.textContent = text;
}
function release() {
  if (phase !== "back") return;

  late = Math.max(0, Math.min(1, (hold - (TOP_T + 0.1)) / 0.5));
  early = Math.max(0, Math.min(1, (TOP_T * 0.8 - hold) / (TOP_T * 0.6)));

}
function step(dt) {
  phaseT += dt;
  if (phase === "address" && touring && phaseT > 1.6) { phase = "back"; phaseT = 0; hold = 0; autoHold = AUTO[autoIndex++ % AUTO.length]; }
  if (phase === "back") {
    hold += dt;
    if (!userHolding && autoHold && hold >= autoHold) { autoHold = 0; release(); }
    if (!userHolding && !autoHold && !touring && hold > 0.05 && phase === "back") release();
  } else if (phase === "down" && phaseT >= DUR.down) {
    phase = "follow"; phaseT = 0;
    shot = shotOf(topU, late, early, ++shotCount * 0.37 + 0.11);
    flightT = 0; roomT = 0; feedbackT = -1;
  } else if (phase === "follow" && phaseT >= DUR.follow) { phase = "finish"; phaseT = 0; }
  else if (phase === "finish" && phaseT >= DUR.finish) { phase = "return"; phaseT = 0; }
  else if (phase === "return" && phaseT >= DUR.ret) { phase = "address"; phaseT = 0; roomT = -1; }
  if (flightT >= 0) {
    const was = flightT;
    flightT += dt;
    if (was < FLIGHT + ROLL && flightT >= FLIGHT + ROLL) { history.push(shot); feedback = feedbackOf(shot, late, early); feedbackT = 0; status.textContent = "캐리 " + Math.round(shot.carry) + "미터. " + feedback; }
  }
  if (roomT >= 0) roomT += dt;
  if (feedbackT >= 0) feedbackT += dt;

}
function tick(now) {

  step(dt);

}
function run() { if (!frame && visible && !still.matches) { previous = 0; frame = requestAnimationFrame(tick); } }
function takeOver() {

  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; run(); } }, 15000);
}
function press() {

  else if (phase === "back") { autoHold = 0; userHolding = true; run(); }
}
function lift() { if (userHolding) { userHolding = false; release(); run(); } }
stage.addEventListener("keydown", (e) => { if (e.key === " " && !e.repeat) { e.preventDefault(); press(); } });
stage.addEventListener("keyup", (e) => { if (e.key === " ") { e.preventDefault(); lift(); } });
stage.addEventListener("pointerdown", (e) => { stage.focus({ preventScroll: true }); stage.setPointerCapture?.(e.pointerId); press(); });
stage.addEventListener("pointerup", lift);
stage.addEventListener("pointercancel", lift);
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) { shot = shotOf(1, 0, 0, 0.4); history = [shot]; flightT = FLIGHT + ROLL; phase = "finish"; }
draw();
