.iso{

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;

  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;

}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}

.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}

.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}

.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}

body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

</aside></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);

}
function depthOf([x, y, z], projection) {

const tenth = (value) => {

function pathOf(points, closed = false) {

function roundedPlan({ x, y, w, d, r }, steps = 8) {

        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {

        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

            run.push((index + 1) % count);

function extrude(ring, z, height, projection, options = {}) {

  L: { thigh: [3, 90], shin: [3, 90], foot: [66, 55] },
  RA: { upper: [18, 25], fore: [42, -70] },
  LA: { upper: [18, 25], fore: [42, -70] },

const SEGMENTS = [

  {
    name: "아라베스크",
    pose: {
      tilt: 16,
      R: { thigh: [82, 176], shin: [86, 178], foot: [96, 180] },
      L: { thigh: [2, 90], shin: [2, 90], foot: [66, 55] },

const PHASES = [1.0, 1.6, 1.6, 1.4];
const PERIOD = PHASES.reduce((a, b) => a + b, 0);
const CLIP = SEGMENTS.length * PERIOD; // the whole VX clip, in seconds

const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

// A pose as a flat list of numbers, so poses can be eased and followed component by component.
const LIMBS = [["R", "thigh"], ["R", "shin"], ["R", "foot"], ["L", "thigh"], ["L", "shin"], ["L", "foot"], ["RA", "upper"], ["RA", "fore"], ["LA", "upper"], ["LA", "fore"]];

function poseAt(segment, t) {

// Forward kinematics: joints in body-local [r, f, z], lifted so the lower ankle sits at ankle height.
function skeleton(flat) {
  const pose = unflatten(flat);

  const q = pose.roll * RAD;

    return [r * Math.cos(q) + z1 * Math.sin(q), f1, -r * Math.sin(q) + z1 * Math.cos(q)];

    const ankle = add(knee, dirOf(pose[key].shin, side), B.shin);
    const toe = add(ankle, dirOf(pose[key].foot, side), B.foot);
    Object.assign(J, { ["hip" + key]: hip, ["knee" + key]: knee, ["ankle" + key]: ankle, ["toe" + key]: toe });
  }

  J.chest = rot([0, 0, B.waist + B.chest]);
  J.neck = rot([0, 0, B.waist + B.chest + B.neck]);
  const n = pose.nod * RAD;
  J.head = rot([0, Math.sin(n) * B.head, B.waist + B.chest + B.neck + Math.cos(n) * B.head]);
  for (const [key, side] of [["RA", 1], ["LA", -1]]) {
    const shoulder = rot([side * B.shoulderW, 0, B.waist + B.chest - 4]);
    const elbow = add(shoulder, rot(dirOf(pose[key].upper, side)), B.upper);
    const wrist = add(elbow, rot(dirOf(pose[key].fore, side)), B.fore);
    const s = key[0];
    Object.assign(J, { ["shoulder" + s]: shoulder, ["elbow" + s]: elbow, ["wrist" + s]: wrist });
  }
  const lift = B.ankle - Math.min(J.ankleR[2], J.ankleL[2]);
  for (const name in J) J[name] = [J[name][0], J[name][1], J[name][2] + lift];
  return J;
}

// The limbs drawn, as [from, to, radius in cm].
const BONES = [
  ["hipR", "kneeR", 6.2], ["kneeR", "ankleR", 4.6], ["ankleR", "toeR", 3],
  ["hipL", "kneeL", 6.2], ["kneeL", "ankleL", 4.6], ["ankleL", "toeL", 3],
  ["hipL", "hipR", 8.5], ["pelvis", "waist", 8], ["waist", "chest", 11.5], ["chest", "neck", 3.6],
  ["shoulderL", "shoulderR", 5], ["shoulderR", "elbowR", 3.6], ["elbowR", "wristR", 3], ["shoulderL", "elbowL", 3.6], ["elbowL", "wristL", 3],
];
const BALLS = [["kneeR", 5], ["kneeL", 5], ["elbowR", 3.6], ["elbowL", 3.6], ["shoulderR", 5.2], ["shoulderL", 5.2], ["ankleR", 3.8], ["ankleL", 3.8], ["wristR", 3.2], ["wristL", 3.2]];
const HEAD_R = BODY.head;

// A camera looking at the dancer from heading `yaw` (degrees from straight in front, positive toward her right),
// as a mirror shows it: her right on the viewer's right. Returns [x, y] in cm, y up from the floor.
function mirrorView([r, f, z], yaw) {
  const a = yaw * RAD;
  return [r * Math.cos(a) - f * Math.sin(a), z];
}

// How the learner follows the projected demonstration: an exponential lag on every joint angle.
const LAG = 0.38; // seconds

// ---------- model walking (공간확장 모듈) ----------
// A catwalk step cycle. phase 0..1 is one full stride (two steps). style sets how the walk is carried:
// stride (thigh swing, degrees), tilt (hunch forward), roll (right shoulder drop), nod (head down), arms (swing ratio).
const WALK_STYLES = {
  past: { stride: 15, tilt: 9, roll: 6, nod: 24, arms: 0.25, bend: 22 },
  now: { stride: 23, tilt: -2, roll: 0, nod: -4, arms: 0.55, bend: 14 },
};
const swingOf = (deg) => [Math.abs(deg), deg >= 0 ? 0 : 180];
function walkPose(phase, style) {
  const a = phase * Math.PI * 2;
  const s = Math.sin(a);
  const legs = {};
  for (const [key, sign, off] of [["R", 1, 0], ["L", -1, Math.PI]]) {
    const th = style.stride * Math.sin(a + off);
    // The knee folds while the leg swings through (the half cycle after it leaves the floor behind).
    const fold = style.bend * Math.max(0, Math.sin(a + off + 1.1));
    legs[key] = { thigh: swingOf(th), shin: swingOf(th - fold), foot: [th > 4 ? 78 : 68, th > 4 ? 0 : 4] };
    void sign;
  }
  const arm = (off) => {
    const al = -style.stride * style.arms * Math.sin(a + off);
    return { upper: swingOf(al + 3), fore: swingOf(al + 12) };
  };
  return flatten({ tilt: style.tilt, roll: style.roll, nod: style.nod, R: legs.R, L: legs.L, RA: arm(0), LA: arm(Math.PI) });
  void s;
}

// Drawing the dancer. Pure: no imports. The build passes the kit's iso/depthOf; the page uses the kit's globals.
// Needs model.mjs (BONES, BALLS, HEAD_R, mirrorView) in scope when inlined; the build strips this import line.


const dnF = (v) => (Math.round(v * 10) / 10).toString();
const dnPt = (p) => dnF(p[0]) + " " + dnF(p[1]);

// The kit light (from the left and above) as a screen direction.
const DN_LIGHT = (() => { const l = [-1, -0.62]; const n = Math.hypot(l[0], l[1]); return [l[0] / n, l[1] / n]; })();

function dnCapsule(a, b, s) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  if (L < 0.05) return dnCircle(a, s);
  const nx = (-dy / L) * s, ny = (dx / L) * s;
  const r = dnF(s);
  return "M" + dnPt([a[0] + nx, a[1] + ny]) + "L" + dnPt([b[0] + nx, b[1] + ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([b[0] - nx, b[1] - ny]) +
    "L" + dnPt([a[0] - nx, a[1] - ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([a[0] + nx, a[1] + ny]) + "Z";
}
function dnCircle(c, s) {
  const r = dnF(s);
  return "M" + dnPt([c[0] - s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] + s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] - s, c[1]]) + "Z";
}
// Offset across a capsule toward the light, as a screen vector of unit length (or less when the light runs along it).
function dnSide(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  const along = DN_LIGHT[0] * ux + DN_LIGHT[1] * uy;
  return [DN_LIGHT[0] - along * ux, DN_LIGHT[1] - along * uy];
}

// A turned-wood mannequin: every limb a capsule, every joint a ball, sorted far to near.
// place: [X, Y] world position of the pelvis on the floor; the dancer faces -y, so her right is -x.
// extras: [{ at: world point, svg }] sorted in with the body parts (a headset, a phone, a microphone).
function mannequinSvg(J, place, P, isoFn, depthFn, heading = 0, lift = 0, extras = []) {

    const side = dnSide(a, b);
    const offs = (p, t) => [p[0] + side[0] * s * t, p[1] + side[1] * s * t];
    const body = dnCapsule(a, b, s);
    const shine = dnCapsule(offs(a, 0.42), offs(b, 0.42), s * 0.42);
    const shade = dnCapsule(offs(a, -0.5), offs(b, -0.5), s * 0.42);
    items.push([depthFn(mid, P), '<g class="mq-part"><path class="mq-body" d="' + body + '"/><path class="mq-shade" d="' + shade + '"/><path class="mq-shine" d="' + shine + '"/><path class="mq-edge" d="' + body + '"/></g>']);

  };
  for (const [name, r] of BALLS) ball(world(J[name]), r, 0.6);
  const head = world(J.head);
  ball(head, HEAD_R, 0.4);
  // A bun at the back of the head: behind it and a little up.
  const neck = world(J.neck);
  const up = [head[0] - neck[0], head[1] - neck[1], head[2] - neck[2]];
  const n = Math.hypot(up[0], up[1], up[2]) || 1;
  ball([head[0] - fw[0] * 7.5 + up[0] / n * 6, head[1] - fw[1] * 7.5 + up[1] / n * 6, head[2] + up[2] / n * 6 - 1], 4.6, 0.8);
  for (const e of extras) items.push([depthFn(e.at, P) + (e.bias || 0), e.svg]);
  items.sort((p, q) => p[0] - q[0]);
  return items.map((item) => item[1]).join("");
}

// The dancer as a video shows her on a panel face, in the face plane's own coordinates (u along world x, v = -z).
// mirror: true shows her right on the viewer's right. cx: the panel centre in world x. floor: the image's floor height.
function screenFigureSvg(J, { yaw = 0, mirror = true, cx: centre = 0, shift = 0, floor = 0, scale = 1, cls = "vx" }) {

    const p = at(J[from]), q = at(J[to]);
    const d = "M" + dnPt(p) + "L" + dnPt(q);
    const depthOf2 = (toward(J[from]) + toward(J[to])) / 2;
    const far = depthOf2 < mid - 4 && from !== "pelvis" && from !== "waist" ? ' class="' + cls + '-far"' : "";
    rims.push('<path class="' + cls + '-rim" d="' + d + '" stroke-width="' + dnF(r * 2 * scale + rim) + '"/>');
    parts.push([depthOf2, '<path' + far + ' d="' + d + '" stroke-width="' + dnF(r * 2 * scale - rim * 0.4) + '"/>']);
  }
  const head = at(J.head);
  rims.push('<circle class="' + cls + '-rim" cx="' + dnF(head[0]) + '" cy="' + dnF(head[1]) + '" r="' + dnF(HEAD_R * scale + rim / 2) + '"/>');
  parts.push([toward(J.head), '<circle class="' + cls + '-head" cx="' + dnF(head[0]) + '" cy="' + dnF(head[1]) + '" r="' + dnF(HEAD_R * scale - rim * 0.2) + '"/>']);
  parts.sort((p, q) => p[0] - q[0]);
  // A soft contact shadow under the feet in the video.
  const feet = [at(J.toeR), at(J.toeL), at(J.ankleR), at(J.ankleL)].filter((p) => -p[1] < floor + 14 * scale);
  const xs = feet.length ? feet.map((p) => p[0]) : [cx];
  const sx0 = Math.min(...xs) - 10 * scale, sx1 = Math.max(...xs) + 10 * scale;
  const shadow = '<ellipse class="' + cls + '-floor" cx="' + dnF((sx0 + sx1) / 2) + '" cy="' + dnF(-floor) + '" rx="' + dnF((sx1 - sx0) / 2) + '" ry="' + dnF(3.2 * scale) + '"/>';
  return shadow + '<g class="' + cls + '-limbs">' + rims.join("") + parts.map((p) => p[1]).join("") + "</g>";
}

const P = {"origin":[175.6915310885753,194.05881535039705],"scale":0.5439721274000343,"azimuth":68,"elevation":30};
const LEARNER = [75,80];
const PANEL_CX = [75,225,375];
const IMG_FLOOR = 19, PRO_YAW = 18, CAM_YAW = 37.35;
const SEG_NAMES = ["플리에","탄듀","데벨로페","아라베스크"];
const START = { seg: 2, t: 3.2 };
const PLAY = { x0: 2.9, x1: 31.1 };
// Live code for the ballet mirror. Inlined after the kit, model.mjs and dancer.mjs (constants come from build.mjs).
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const learnerEl = svg.querySelector('[data-part="learner"]');
const screens = [0, 1, 2].map((i) => svg.querySelector('[data-screen="' + i + '"]'));
const preview = svg.querySelector('[data-screen="laptop"]');
const segEls = [...svg.querySelectorAll("[data-seg]")];
const playhead = svg.querySelector('[data-part="playhead"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");

let seg = START.seg, t = START.t;
let follower = poseAt(seg, t - LAG);
let frame = 0, previous = 0, visible = false, touring = !still.matches, idleTimer = 0, sinceSwitch = 0;

function fmt(seconds) {
  const s = Math.max(0, seconds);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + (s % 60).toFixed(1).padStart(4, "0");
}
function draw() {
  const pro = poseAt(seg, still.matches ? PHASES[0] + PHASES[1] + 0.5 : t);
  if (still.matches) follower = pro.slice();
  const Jp = skeleton(pro);
  const Jl = skeleton(follower);
  // Panel 1: the VX clip mirrored, life size. Panel 2: the same clip as filmed. Panel 3: the rear camera, mirrored.
  screens[0].innerHTML = screenFigureSvg(Jp, { yaw: PRO_YAW, mirror: true, cx: PANEL_CX[0], shift: 18, floor: IMG_FLOOR, cls: "vx" });
  screens[1].innerHTML = screenFigureSvg(Jp, { yaw: PRO_YAW, mirror: false, cx: PANEL_CX[1], shift: -26, floor: IMG_FLOOR, cls: "vx" });
  screens[2].innerHTML = screenFigureSvg(Jl, { yaw: CAM_YAW, mirror: true, cx: PANEL_CX[2], shift: 30, floor: IMG_FLOOR, cls: "cam" });
  preview.innerHTML = screenFigureSvg(Jp, { yaw: PRO_YAW, mirror: false, cx: 17, shift: -1.2, floor: 7.4, scale: 0.068, cls: "vx" });
  learnerEl.innerHTML = mannequinSvg(Jl, LEARNER, P, iso, depthOf);
  const clock = seg * PERIOD + (((t % PERIOD) + PERIOD) % PERIOD);
  const x = PLAY.x0 + (PLAY.x1 - PLAY.x0) * (clock / CLIP);
  playhead.setAttribute("d", "M" + x.toFixed(2) + " -5.4V-2");
  const text = "구간 " + (seg + 1) + "/4 · " + SEG_NAMES[seg] + " · " + fmt(clock);
  if (readout.textContent !== text) readout.textContent = text;
}
function select(next, announce = true) {
  seg = (next + SEGMENTS.length) % SEGMENTS.length;
  t = 0;
  sinceSwitch = 0;
  segEls.forEach((el, i) => el.toggleAttribute("data-on", i === seg));
  if (announce) status.textContent = "구간 " + (seg + 1) + ", " + SEG_NAMES[seg] + " 재생";
  draw();
  run();
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 20) : 1 / 60;
  previous = now;
  t += dt;
  sinceSwitch += dt;
  if (touring && sinceSwitch > PERIOD * 2 - 0.05) select(seg + 1, false);
  // The learner follows the projected demonstration with a lag, joint by joint.
  const target = poseAt(seg, t);
  const a = 1 - Math.exp(-dt / LAG);
  follower = follower.map((v, i) => v + (target[i] - v) * a);
  draw();
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible && !still.matches) { previous = 0; frame = requestAnimationFrame(tick); }
}
function takeOver() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; sinceSwitch = 0; run(); } }, 14000);
}
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const n = Number(event.key);
  if (n >= 1 && n <= SEGMENTS.length) { event.preventDefault(); takeOver(); select(n - 1); return; }
  if (event.key === "ArrowRight") { event.preventDefault(); takeOver(); select(seg + 1); }
  if (event.key === "ArrowLeft") { event.preventDefault(); takeOver(); select(seg - 1); }
});
svg.addEventListener("click", (event) => {
  const hit = event.target.closest('[data-part="laptop-hit"]');
  if (!hit) return;
  takeOver();
  select(seg + 1);
  stage.focus({ preventScroll: true });
});
still.addEventListener("change", () => { draw(); run(); });
segEls.forEach((el, i) => el.toggleAttribute("data-on", i === seg));
draw();
