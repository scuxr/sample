<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube VR 360</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <!-- YouTube 기본 플레이어가 클릭·재생·음량·360도 회전을 직접 처리합니다. -->
  <iframe
    title="YouTube VR 360 영상"
    src="https://www.youtube.com/embed/HgYWmgxCtrM?autoplay=0&amp;controls=1&amp;playsinline=1&amp;rel=0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; xr-spatial-tracking"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
