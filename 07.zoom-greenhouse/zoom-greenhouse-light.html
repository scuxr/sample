</aside></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;

function extrude(ring, z, height, projection, options = {}) {

// Pose model for the ballet mirror figure. Pure: no imports, inlined into the page as-is.
// Body-local coordinates are [r, f, z] in cm: r to the dancer's right, f forward, z up, floor at z = 0.

const BODY = { hipW: 9, thigh: 43, shin: 42, foot: 17, ankle: 7, waist: 17, chest: 31, neck: 8, head: 11, shoulderW: 17, upper: 27, fore: 25 };

// First position, arms low: where every segment starts and ends.
const PREP = {

  L: { thigh: [3, 90], shin: [3, 90], foot: [66, 55] },
  RA: { upper: [18, 25], fore: [42, -70] },
  LA: { upper: [18, 25], fore: [42, -70] },

// The four demonstration segments the instructor can pick on the laptop. Right leg works.
const SEGMENTS = [

      L: { thigh: [34, 55], shin: [34, 235], foot: [66, 55] },

      LA: { upper: [58, 32], fore: [82, -62] },

    pose: {

      R: { thigh: [13, 90], shin: [13, 90], foot: [62, 90] },
      L: { thigh: [2, 90], shin: [2, 90], foot: [66, 55] },

      LA: { upper: [76, 78], fore: [82, 96] },
    },
  },
  {
    name: "데벨로페",
    pose: {
      tilt: -4,
      R: { thigh: [88, 82], shin: [92, 86], foot: [100, 88] },
      L: { thigh: [2, 90], shin: [2, 90], foot: [66, 55] },
      RA: { upper: [80, 80], fore: [86, 96] },
      LA: { upper: [155, 30], fore: [150, -70] },
    },
  },
  {
    name: "아라베스크",
    pose: {
      tilt: 16,
      R: { thigh: [82, 176], shin: [86, 178], foot: [96, 180] },
      L: { thigh: [2, 90], shin: [2, 90], foot: [66, 55] },
      RA: { upper: [84, 118], fore: [86, 128] },
      LA: { upper: [96, 6], fore: [98, 4] },
    },
  },

// One segment of the VX clip: 1.0 s in first position, 1.6 s into the pose, 1.6 s held, 1.4 s back.
const PHASES = [1.0, 1.6, 1.6, 1.4];
const PERIOD = PHASES.reduce((a, b) => a + b, 0);
const CLIP = SEGMENTS.length * PERIOD; // the whole VX clip, in seconds

const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
// How far into the pose the professional is, 0..1, at time t inside a segment.
function weightAt(t) {

  if (u < a + b) return ease((u - a) / b);

// A pose as a flat list of numbers, so poses can be eased and followed component by component.
const LIMBS = [["R", "thigh"], ["R", "shin"], ["R", "foot"], ["L", "thigh"], ["L", "shin"], ["L", "foot"], ["RA", "upper"], ["RA", "fore"], ["LA", "upper"], ["LA", "fore"]];

  for (const [g, k] of LIMBS) out.push(pose[g][k][0], pose[g][k][1]);
  out.push(pose.roll || 0, pose.nod || 0);

}
function unflatten(v) {
  const pose = { tilt: v[0], R: {}, L: {}, RA: {}, LA: {} };
  LIMBS.forEach(([g, k], i) => (pose[g][k] = [v[1 + i * 2], v[2 + i * 2]]));

const PREP_FLAT = flatten(PREP);
const SEG_FLAT = SEGMENTS.map((s) => flatten(s.pose));
function poseAt(segment, t) {
  const w = weightAt(t);
  const target = SEG_FLAT[segment];
  return PREP_FLAT.map((v, i) => v + (target[i] - v) * w);

// Forward kinematics: joints in body-local [r, f, z], lifted so the lower ankle sits at ankle height.
function skeleton(flat) {
  const pose = unflatten(flat);
  const B = BODY;
  const t = pose.tilt * RAD;
  // Upper body: lean forward by tilt, then drop the right shoulder by roll (both about the pelvis).
  const q = pose.roll * RAD;
  const rot = ([r, f, z]) => {
    const f1 = f * Math.cos(t) + z * Math.sin(t), z1 = -f * Math.sin(t) + z * Math.cos(t);
    return [r * Math.cos(q) + z1 * Math.sin(q), f1, -r * Math.sin(q) + z1 * Math.cos(q)];

  for (const [key, side] of [["R", 1], ["L", -1]]) {
    const hip = [side * B.hipW, 0, 0];
    const knee = add(hip, dirOf(pose[key].thigh, side), B.thigh);
    const ankle = add(knee, dirOf(pose[key].shin, side), B.shin);
    const toe = add(ankle, dirOf(pose[key].foot, side), B.foot);
    Object.assign(J, { ["hip" + key]: hip, ["knee" + key]: knee, ["ankle" + key]: ankle, ["toe" + key]: toe });
  }

  J.chest = rot([0, 0, B.waist + B.chest]);
  J.neck = rot([0, 0, B.waist + B.chest + B.neck]);
  const n = pose.nod * RAD;
  J.head = rot([0, Math.sin(n) * B.head, B.waist + B.chest + B.neck + Math.cos(n) * B.head]);
  for (const [key, side] of [["RA", 1], ["LA", -1]]) {
    const shoulder = rot([side * B.shoulderW, 0, B.waist + B.chest - 4]);
    const elbow = add(shoulder, rot(dirOf(pose[key].upper, side)), B.upper);
    const wrist = add(elbow, rot(dirOf(pose[key].fore, side)), B.fore);
    const s = key[0];
    Object.assign(J, { ["shoulder" + s]: shoulder, ["elbow" + s]: elbow, ["wrist" + s]: wrist });
  }
  const lift = B.ankle - Math.min(J.ankleR[2], J.ankleL[2]);
  for (const name in J) J[name] = [J[name][0], J[name][1], J[name][2] + lift];

// The limbs drawn, as [from, to, radius in cm].
const BONES = [
  ["hipR", "kneeR", 6.2], ["kneeR", "ankleR", 4.6], ["ankleR", "toeR", 3],
  ["hipL", "kneeL", 6.2], ["kneeL", "ankleL", 4.6], ["ankleL", "toeL", 3],
  ["hipL", "hipR", 8.5], ["pelvis", "waist", 8], ["waist", "chest", 11.5], ["chest", "neck", 3.6],
  ["shoulderL", "shoulderR", 5], ["shoulderR", "elbowR", 3.6], ["elbowR", "wristR", 3], ["shoulderL", "elbowL", 3.6], ["elbowL", "wristL", 3],
];
const BALLS = [["kneeR", 5], ["kneeL", 5], ["elbowR", 3.6], ["elbowL", 3.6], ["shoulderR", 5.2], ["shoulderL", 5.2], ["ankleR", 3.8], ["ankleL", 3.8], ["wristR", 3.2], ["wristL", 3.2]];
const HEAD_R = BODY.head;

// A camera looking at the dancer from heading `yaw` (degrees from straight in front, positive toward her right),
// as a mirror shows it: her right on the viewer's right. Returns [x, y] in cm, y up from the floor.
function mirrorView([r, f, z], yaw) {
  const a = yaw * RAD;
  return [r * Math.cos(a) - f * Math.sin(a), z];
}

// How the learner follows the projected demonstration: an exponential lag on every joint angle.
const LAG = 0.38; // seconds

// ---------- model walking (공간확장 모듈) ----------
// A catwalk step cycle. phase 0..1 is one full stride (two steps). style sets how the walk is carried:
// stride (thigh swing, degrees), tilt (hunch forward), roll (right shoulder drop), nod (head down), arms (swing ratio).
const WALK_STYLES = {
  past: { stride: 15, tilt: 9, roll: 6, nod: 24, arms: 0.25, bend: 22 },
  now: { stride: 23, tilt: -2, roll: 0, nod: -4, arms: 0.55, bend: 14 },
};
const swingOf = (deg) => [Math.abs(deg), deg >= 0 ? 0 : 180];
function walkPose(phase, style) {
  const a = phase * Math.PI * 2;
  const s = Math.sin(a);
  const legs = {};
  for (const [key, sign, off] of [["R", 1, 0], ["L", -1, Math.PI]]) {
    const th = style.stride * Math.sin(a + off);
    // The knee folds while the leg swings through (the half cycle after it leaves the floor behind).
    const fold = style.bend * Math.max(0, Math.sin(a + off + 1.1));
    legs[key] = { thigh: swingOf(th), shin: swingOf(th - fold), foot: [th > 4 ? 78 : 68, th > 4 ? 0 : 4] };
    void sign;
  }
  const arm = (off) => {
    const al = -style.stride * style.arms * Math.sin(a + off);
    return { upper: swingOf(al + 3), fore: swingOf(al + 12) };
  };
  return flatten({ tilt: style.tilt, roll: style.roll, nod: style.nod, R: legs.R, L: legs.L, RA: arm(0), LA: arm(Math.PI) });
  void s;
}

// Drawing the dancer. Pure: no imports. The build passes the kit's iso/depthOf; the page uses the kit's globals.
// Needs model.mjs (BONES, BALLS, HEAD_R, mirrorView) in scope when inlined; the build strips this import line.


const dnF = (v) => (Math.round(v * 10) / 10).toString();
const dnPt = (p) => dnF(p[0]) + " " + dnF(p[1]);

// The kit light (from the left and above) as a screen direction.
const DN_LIGHT = (() => { const l = [-1, -0.62]; const n = Math.hypot(l[0], l[1]); return [l[0] / n, l[1] / n]; })();

function dnCapsule(a, b, s) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  if (L < 0.05) return dnCircle(a, s);
  const nx = (-dy / L) * s, ny = (dx / L) * s;
  const r = dnF(s);
  return "M" + dnPt([a[0] + nx, a[1] + ny]) + "L" + dnPt([b[0] + nx, b[1] + ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([b[0] - nx, b[1] - ny]) +
    "L" + dnPt([a[0] - nx, a[1] - ny]) + "A" + r + " " + r + " 0 0 0 " + dnPt([a[0] + nx, a[1] + ny]) + "Z";
}
function dnCircle(c, s) {
  const r = dnF(s);
  return "M" + dnPt([c[0] - s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] + s, c[1]]) + "A" + r + " " + r + " 0 1 0 " + dnPt([c[0] - s, c[1]]) + "Z";
}
// Offset across a capsule toward the light, as a screen vector of unit length (or less when the light runs along it).
function dnSide(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  const along = DN_LIGHT[0] * ux + DN_LIGHT[1] * uy;
  return [DN_LIGHT[0] - along * ux, DN_LIGHT[1] - along * uy];
}

// A turned-wood mannequin: every limb a capsule, every joint a ball, sorted far to near.
// place: [X, Y] world position of the pelvis on the floor; the dancer faces -y, so her right is -x.
// extras: [{ at: world point, svg }] sorted in with the body parts (a headset, a phone, a microphone).
function mannequinSvg(J, place, P, isoFn, depthFn, heading = 0, lift = 0, extras = []) {

  const scale = Math.abs(isoFn([0, 0, 1], P)[1] - isoFn([0, 0, 0], P)[1]) / Math.cos(((P.elevation || 30) * Math.PI) / 180);

    const shine = dnCapsule(offs(a, 0.42), offs(b, 0.42), s * 0.42);
    const shade = dnCapsule(offs(a, -0.5), offs(b, -0.5), s * 0.42);

  out.push('<clipPath id="' + id + '"><path d="' + rr(inner.x0, inner.y0, inner.x1, inner.y1, Math.min(3, (r.x1 - r.x0) * 0.03)) + '"/></clipPath><g clip-path="url(#' + id + ')">');
  if (who < 0) {
    // Professor: a wider frame of the greenhouse, chest up, the pot in her hands.
    const J = skeleton(st.prof.flat);
    const wr = J.wristL;
    out.push(portrait(J, inner, { kind: "greenhouse", cls: "pt-prof", talking: !st.parts[1].talking || st.parts[1].talking < 0.5 ? 1 : 0, t, pot: [wr[0], 0, wr[2] + 6], top: "#2f6b45", hair: "#3a2a22" }));
  } else {
    const p = PLACES[who];
    out.push(portrait(skeleton(st.parts[who].flat), inner, { kind: p.bg, cls: "pt-part", talking: st.parts[who].talking > 0.5 ? 1 : 0, t, top: p.top, hair: who === 2 ? "#6b4a2e" : "#241d1a" }));
  }
  out.push("</g>");
  const fs = Math.max(2.2, (r.y1 - r.y0) * (big ? 0.05 : 0.085));
  const label = who < 0 ? "교수 · 온실 스튜디오" : PLACES[who].name + " · " + PLACES[who].where;
  out.push('<path class="zm-name-bg" d="M' + pf(r.x0 + fs * 0.4) + " " + pf(r.y1 - fs * 1.7) + "h" + pf(label.length * fs * 0.78 + fs) + "v" + pf(fs * 1.4) + "h" + pf(-(label.length * fs * 0.78 + fs)) + 'Z"/>');
  out.push('<text class="zm-name" x="' + pf(r.x0 + fs * 0.9) + '" y="' + pf(r.y1 - fs * 0.65) + '" font-size="' + pf(fs) + '">' + label + "</text>");
  const speaking = who < 0 ? st.speaker === 0 : who === 1 && st.speaker === 2;
  if (speaking) out.push('<path class="zm-speaking" d="' + rr(r.x0, r.y0, r.x1, r.y1, Math.min(3, (r.x1 - r.x0) * 0.03)) + '"/>');
  if (who === 0 && st.parts[0].hand > 0.3) {
    const bx = r.x1 - fs * 1.6, by = r.y0 + fs * 1.6;
    out.push('<circle class="zm-hand" cx="' + pf(bx) + '" cy="' + pf(by) + '" r="' + pf(fs * 1.1) + '"/><text class="zm-hand-t" x="' + pf(bx) + '" y="' + pf(by + fs * 0.4) + '" font-size="' + pf(fs * 1.1) + '" text-anchor="middle">✋</text>');
  }
  return out.join("");
}
function zoomScreen(mode, r, st, t) {
  const out = ['<path class="zm-bg" d="M' + r.x0 + " " + r.y0 + "H" + r.x1 + "V" + r.y1 + "H" + r.x0 + 'Z"/>'];
  const bar = (r.y1 - r.y0) * 0.08;
  const body = { x0: r.x0, y0: r.y0, x1: r.x1, y1: r.y1 - bar };
  if (mode === 0) for (const tile of galleryTiles(body)) out.push(tileSvg(tile.who, tile.r, st, t));
  else {
    const pad = (body.x1 - body.x0) * 0.02;
    out.push(tileSvg(mode === 1 ? -1 : mode - 2, { x0: body.x0 + pad, y0: body.y0 + pad, x1: body.x1 - pad, y1: body.y1 - pad * 0.5 }, st, t, { big: true }));
  }
  // The meeting bar: mute, video, participants, chat, and which view is up.
  const fs = bar * 0.42;
  const y = r.y1 - bar * 0.35;
  out.push('<path class="zm-bar" d="M' + r.x0 + " " + pf(r.y1 - bar) + "H" + r.x1 + "V" + r.y1 + "H" + r.x0 + 'Z"/>');
  const items = ["음소거", "비디오", "참가자 6", "채팅", "손 들기", "기록 ●"];
  items.forEach((s, i) => out.push('<text class="zm-bar-t' + (i === 5 ? " zm-rec" : "") + '" x="' + pf(r.x0 + (r.x1 - r.x0) * (0.06 + i * 0.12)) + '" y="' + pf(y) + '" font-size="' + pf(fs) + '">' + s + "</text>"));
  out.push('<text class="zm-mode" x="' + pf(r.x1 - fs) + '" y="' + pf(y) + '" font-size="' + pf(fs) + '" text-anchor="end">' + MODES[mode] + "</text>");
  return out.join("");
}

const P = {"origin":[274.291157763577,293.4767035513415],"scale":0.4072949551931292,"azimuth":56,"elevation":30};
const SCR_R = {"x0":30,"x1":430,"y0":-285,"y1":-60};
// Live code for the greenhouse Zoom lecture. Inlined after the kit, model, dancer, gear and people modules.
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const status = document.querySelector("[data-status]");
const profEl = svg.querySelector('[data-part="prof"]');
const partEls = PLACES.map((_, i) => svg.querySelector('[data-part="part' + i + '"]'));
const bigEl = svg.querySelector('[data-view="big"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");

let clock = 0, mode = 0, frame = 0, previous = 0, visible = false, touring = !still.matches, idleTimer = 0, modeT = 0, frameNo = 0;
const scaleS = Math.abs(iso([0, 0, 1], P)[1] - iso([0, 0, 0], P)[1]) / Math.cos(((P.elevation || 30) * Math.PI) / 180);
const TOUR = [[0, 7], [1, 5], [2, 4.5], [3, 4.5], [4, 4], [5, 4]];
let tourIndex = 0;

function potSvg(c) {
  // A terracotta pot with a leafy top, as the professor holds it.
  const a = iso([c[0], c[1], c[2] - 5], P), b = iso([c[0], c[1], c[2] + 5], P);
  const out = ['<path class="pot-body" d="' + dnCapsule(a, b, 6.2 * scaleS) + '"/>'];
  for (const [dx, dy, dz, r] of [[-4, 0, 11, 6], [4, 1, 11, 6], [0, -1, 17, 7], [-7, 2, 16, 4.5], [7, -2, 18, 4.5]]) out.push('<path class="pot-leaf" d="' + dnCircle(iso([c[0] + dx, c[1] + dy, c[2] + dz], P), r * scaleS) + '"/>');
  return out.join("");
}
function draw(st) {
  const J = skeleton(st.prof.flat);
  const wl = toWorld(J.wristL, st.prof.at, PROF.heading);
  const ax = facingAxes(PROF.heading);
  const potC = [wl[0] + ax.fw[0] * 6 - ax.rt[0] * 4, wl[1] + ax.fw[1] * 6 - ax.rt[1] * 4, wl[2] + 4];
  profEl.innerHTML = mannequinSvg(J, st.prof.at, P, iso, depthOf, PROF.heading, 0, [{ at: potC, svg: potSvg(potC), bias: 2 }]);
  st.parts.forEach((p, i) => {
    const Jp = skeleton(p.flat);
    const at = personAt(i);
    const hd = headingOf(i);
    const place = [at[0], at[1] + (hd ? 0 : 2)];
    const extras = [];
    if (PLACES[i].seat === "sofa") {
      // The tablet in both hands, its screen toward her.
      const wr = toWorld(Jp.wristR, place, hd), wlp = toWorld(Jp.wristL, place, hd);
      const tf = facingAxes(hd, -30);
      const c = [(wr[0] + wlp[0]) / 2 + tf.fw[0] * 3, (wr[1] + wlp[1]) / 2 + tf.fw[1] * 3, (wr[2] + wlp[2]) / 2 + 6];
      const t = tf;
      extras.push({ at: c, bias: 1, svg: boxSvg(c, [t.rt, t.fw, t.up], [12, 0.6, 8.5], P, iso) });
    }
    partEls[i].innerHTML = mannequinSvg(Jp, place, P, iso, depthOf, hd, 0, extras);
  });
  if (frameNo++ % 2 === 0) bigEl.innerHTML = zoomScreen(mode, SCR_R, st, clock);
  const events = [];
  if (st.parts[0].hand > 0.3) events.push("참가자 1 손 들기");
  if (st.parts[1].talking > 0.5) events.push("참가자 2 질문 중");
  else events.push("교수 설명 중" + (st.prof.lift > 0.5 ? " · 화분을 들어 보임" : st.prof.point > 0.5 ? " · 잎을 가리킴" : ""));
  const text = "대형 화면: " + MODES[mode] + " · " + events.join(" · ");
  if (readout.textContent !== text) readout.textContent = text;
}
function state() {
  const parts = PLACES.map((_, i) => partState(i, clock));
  return { prof: profState(clock), parts, speaker: speakerOf(clock, parts) };
}
function tick(now) {
  const dt = previous ? Math.min((now - previous) / 1000, 1 / 20) : 1 / 60;
  previous = now;
  clock += dt;
  if (touring) {
    modeT += dt;
    if (modeT > TOUR[tourIndex][1]) { tourIndex = (tourIndex + 1) % TOUR.length; mode = TOUR[tourIndex][0]; modeT = 0; frameNo = 0; }
  }
  draw(state());
  frame = visible && !still.matches ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible && !still.matches) { previous = 0; frame = requestAnimationFrame(tick); } }
function setMode(m) {
  mode = (m + MODES.length) % MODES.length;
  frameNo = 0;
  status.textContent = "대형 화면 " + MODES[mode];
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!still.matches) { touring = true; tourIndex = TOUR.findIndex((x) => x[0] === mode); modeT = 0; run(); } }, 14000);
  draw(state());
  run();
}
stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); setMode(mode + 1); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); setMode(mode - 1); }
  else if (/^[0-5]$/.test(e.key)) { e.preventDefault(); setMode(Number(e.key)); }
});
svg.addEventListener("click", () => { stage.focus({ preventScroll: true }); setMode(mode + 1); });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) clock = 6;
draw(state());
