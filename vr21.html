<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #player {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #drag-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 80px;
      z-index: 50;
      cursor: grab;
      display: none;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #drag-layer:active {
      cursor: grabbing;
    }
    #status-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffd54f;
      border: 1px solid rgba(255, 213, 79, 0.5);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 75vw;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status-badge">유튜브 API 불러오는 중...</div>
  <div id="drag-layer" tabindex="0"></div>
  <div id="player"></div>

  <script>
    var badge = document.getElementById('status-badge');
    var dragLayer = document.getElementById('drag-layer');
    var player;
    var playerCreated = false;
    var isDragging = false;
    var wasDragged = false;
    var downX = 0, downY = 0;
    var startX = 0, startY = 0;
    var yaw = 0, pitch = 0, fov = 100;
    var sphericalActive = false;
    var autoUnmuteTried = false;

    if (window.location.protocol === 'file:') {
      badge.innerHTML = '⚠️ 현재 로컬 파일(file://)로 열려 있습니다.<br>로컬 서버(http://localhost)나 웹 호스팅에 올려야 영상이 나옵니다.';
    }

    function handleApiLoadError() {
      badge.innerHTML = '❌ 유튜브 API 스크립트가 차단되었습니다.<br>브라우저 추적 방지·광고 차단을 해제한 뒤 새로고침해 주세요.';
    }

    function initYouTubePlayer() {
      if (playerCreated) return;
      if (!window.YT || !window.YT.Player) return;
      playerCreated = true;

      badge.textContent = '플레이어 생성 중...';

      var vars = {
        'autoplay': 1,
        'mute': 1,
        'start': 0,
        'fs': 1,
        'playsinline': 1,
        'rel': 0
      };
      if (window.location.protocol.indexOf('http') === 0) {
        vars.origin = window.location.origin;
      }

      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: 'HgYWmgxCtrM',
        playerVars: vars,
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    window.onYouTubeIframeAPIReady = initYouTubePlayer;

    var apiCheckCount = 0;
    var apiWatcher = setInterval(function() {
      apiCheckCount++;
      if (window.YT && window.YT.Player) {
        clearInterval(apiWatcher);
        initYouTubePlayer();
      } else if (apiCheckCount >= 25) {
        clearInterval(apiWatcher);
        badge.innerHTML = '⚠️ 유튜브 API 응답이 차단되었거나 지연되고 있습니다.<br>브라우저 주소창의 추적 방지/광고 차단을 끄고 새로고침해 주세요.';
      }
    }, 200);

    function onPlayerReady(event) {
      badge.textContent = '영상 준비 완료 · 재생 시작 중...';
      event.target.mute();
      event.target.playVideo();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        setTimeout(checkSphericalSupport, 600);

        // 첫 재생 시작 시 자동 소리 켜기 시도 (브라우저 정책 차단 시 무음 재생 유지)
        if (!autoUnmuteTried) {
          autoUnmuteTried = true;
          try {
            player.unMute();
            player.setVolume(100);
          } catch (e) {}

          setTimeout(function() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
              player.mute();
              player.playVideo();
              badge.style.display = 'block';
              badge.textContent = '🔊 화면을 클릭하거나 방향키를 누르면 소리가 켜집니다';
              setTimeout(function() { badge.style.display = 'none'; }, 4000);
            } else if (typeof player.isMuted === 'function' && player.isMuted()) {
              badge.style.display = 'block';
              badge.textContent = '🔊 화면을 클릭하거나 방향키를 누르면 소리가 켜집니다';
              setTimeout(function() { badge.style.display = 'none'; }, 4000);
            }
          }, 250);
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        badge.style.display = 'block';
        badge.textContent = '일시정지 상태입니다. 화면을 클릭하면 재생됩니다.';
      } else if (event.data === YT.PlayerState.BUFFERING) {
        badge.textContent = '영상 버퍼링 중...';
      }
    }

    function onPlayerError(event) {
      var msg = {
        2: '잘못된 영상 ID입니다.',
        5: 'HTML5 플레이어 렌더링 오류입니다.',
        100: '삭제되었거나 비공개 영상입니다.',
        101: '게시자가 외부 사이트 재생(퍼가기)을 막은 영상입니다.',
        150: '게시자가 외부 사이트 재생(퍼가기)을 막은 영상입니다.',
        153: '출처(Referer/Origin) 설정 오류입니다. 웹 서버(http/https)에서 열어주세요.'
      }[event.data] || '알 수 없는 재생 오류';
      badge.style.display = 'block';
      badge.innerHTML = '❌ 유튜브 오류 코드 ' + event.data + '<br>' + msg;
    }

    function checkSphericalSupport() {
      if (!player || typeof player.getSphericalProperties !== 'function') {
        badge.textContent = '⚠️ 360° API 미지원 브라우저입니다.';
        return;
      }
      var props = player.getSphericalProperties();
      if (props && Object.keys(props).length > 0) {
        yaw = props.yaw || 0;
        pitch = props.pitch || 0;
        fov = props.fov || 100;
        player.setSphericalProperties({ enableOrientationSensor: true });
        dragLayer.style.display = 'block';
        sphericalActive = true;
        if (typeof player.isMuted === 'function' && !player.isMuted()) {
          badge.style.display = 'none';
        }
      } else if (!sphericalActive) {
        dragLayer.style.display = 'none';
        badge.innerHTML = '⚠️ 360° 구면 모드가 꺼져 있습니다.<br>(모바일 웹 브라우저이거나 크롬·웨일 하드웨어 가속이 꺼져 있으면 평면으로만 나옵니다)';
      }
    }

    function focusControlLayer() {
      try {
        window.focus();
        if (dragLayer && dragLayer.style.display !== 'none') {
          dragLayer.focus({ preventScroll: true });
        }
      } catch (e) {}
    }

    function turnOnSound() {
      if (!player) return;
      try {
        if (typeof player.unMute === 'function') {
          player.unMute();
          player.setVolume(100);
        }
        badge.style.display = 'none';
      } catch (e) {}
    }

    // 마우스 진입 시 키보드 포커스 확보
    dragLayer.addEventListener('mouseenter', focusControlLayer);

    // 드래그 시점 제어 (preventDefault를 쓰지 않아 iframe 포커스 유지)
    function startDrag(x, y) {
      focusControlLayer();
      isDragging = true;
      wasDragged = false;
      downX = x;
      downY = y;
      startX = x;
      startY = y;

      try {
        var props = player.getSphericalProperties();
        if (props && props.yaw !== undefined) {
          yaw = props.yaw;
          pitch = props.pitch;
          fov = props.fov || fov;
        }
      } catch (err) {}
    }

    function moveDrag(x, y) {
      if (!isDragging) return;
      if (Math.abs(x - downX) > 8 || Math.abs(y - downY) > 8) {
        wasDragged = true;
      }
      var dx = x - startX;
      var dy = y - startY;
      startX = x;
      startY = y;

      if (!wasDragged) return;
      yaw = (yaw - dx * 0.25 + 360) % 360;
      pitch = Math.max(-90, Math.min(90, pitch + dy * 0.25));
      try {
        player.setSphericalProperties({ yaw: yaw, pitch: pitch, fov: fov });
      } catch (err) {}
    }

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      if (wasDragged) {
        turnOnSound();
      }
    }

    dragLayer.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function(e) { moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup', endDrag);

    // 클릭 이벤트에서 소리 활성화 및 재생/일시정지 처리
    dragLayer.addEventListener('click', function() {
      focusControlLayer();
      if (wasDragged) {
        wasDragged = false;
        return;
      }
      if (!player || typeof player.getPlayerState !== 'function') return;

      var state = player.getPlayerState();
      var currentlyMuted = (typeof player.isMuted === 'function' && player.isMuted());

      turnOnSound();

      // 음소거 상태에서 처음 클릭한 경우: 멈추지 않고 소리만 즉시 켬
      if (state === YT.PlayerState.PLAYING && currentlyMuted) {
        return;
      }

      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
        badge.style.display = 'none';
      }
    });

    // 터치 드래그 및 탭 제어
    dragLayer.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1)
