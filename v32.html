<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>VR 360° 플레이어 v32</title>
<style>
  html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
  #player{position:absolute;inset:0;width:100%;height:100%}
  #stage{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#000}
  body.focus-view #hint{display:none}
  body.focus-view #quick-controls{opacity:.18;transition:opacity .15s}
  body.focus-view #quick-controls:hover,body.focus-view #quick-controls:focus-within{opacity:1}
  /* Keep YouTube's bottom transport/volume controls accessible. */
  #look-area{position:absolute;left:0;right:0;top:0;bottom:110px;z-index:2;
    touch-action:none;cursor:grab;outline:0;background:transparent;user-select:none;display:none}
  #look-area.dragging{cursor:grabbing}
  #hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;
    padding:7px 11px;border-radius:7px;background:rgba(0,0,0,.56);color:#fff;
    font:12px/1.4 sans-serif;white-space:nowrap;pointer-events:none;opacity:.85}
  #quick-controls{position:absolute;top:42px;right:12px;z-index:5;display:flex;gap:8px}
  #quick-controls button{border:1px solid rgba(255,255,255,.55);border-radius:7px;
    background:rgba(0,0,0,.70);color:#fff;padding:9px 12px;font:13px/1.2 sans-serif;
    cursor:pointer;touch-action:manipulation}
  #quick-controls button:hover,#quick-controls button:focus-visible{background:#333;outline:2px solid #fff}
  #status{position:absolute;bottom:82px;left:12px;z-index:3;max-width:90%;
    color:#fff;background:rgba(0,0,0,.65);border-radius:5px;padding:5px 8px;
    font:12px/1.4 sans-serif;pointer-events:none;display:none}
  @media(max-height:200px){#look-area{bottom:65px}#hint{display:none}#quick-controls{top:7px}}
</style>
</head>
<body>
<div id="stage">
<div id="player"></div>
<div id="look-area" tabindex="0" aria-label="360도 영상 시점: 마우스 드래그, 휠, 방향키, 더하기 및 빼기 키"></div>
<div id="quick-controls" aria-label="영상 재생 도구">
  <button id="sound-btn" type="button" title="소리 켜기 또는 음소거">🔊 소리</button>
  <button id="focus-btn" type="button" title="LMS iframe 내부의 표시 영역에 집중">▣ 화면 집중</button>
  <button id="open-btn" type="button" title="별도 탭에서 큰 화면으로 보기">↗ 크게 보기</button>
  <button id="fullscreen-btn" type="button" title="전체화면 권한이 허용된 경우에만 작동">⛶ 전체화면</button>
</div>
<div id="hint">클릭: 재생/일시정지 · 드래그: 시점 이동 · 휠: 확대/축소 · 방향키 / + −</div>
<div id="status" role="status"></div>
</div>
<script>
(function(){
  'use strict';
  var VIDEO_ID='HgYWmgxCtrM';
  var player=null, ready=false, spherical=false;
  var view={yaw:0,pitch:0,fov:100};
  var layer=document.getElementById('look-area');
  var hint=document.getElementById('hint');
  var status=document.getElementById('status');
  var soundBtn=document.getElementById('sound-btn');
  var fullscreenBtn=document.getElementById('fullscreen-btn');
  var focusBtn=document.getElementById('focus-btn');
  var openBtn=document.getElementById('open-btn');
  focusBtn.addEventListener('click',function(){
    var enabled=document.body.classList.toggle('focus-view');
    focusBtn.textContent=enabled?'▣ 집중 종료':'▣ 화면 집중';
  });
  openBtn.addEventListener('click',function(){
    // User-initiated navigation: opening the same HTTPS player as a top-level tab
    // avoids LMS iframe size/fullscreen restrictions, while preserving video content.
    var url=new URL(location.href);
    url.searchParams.set('standalone','1');
    var win=window.open(url.toString(),'_blank','noopener,noreferrer');
    if(!win){message('새 탭이 차단되었습니다. 브라우저에서 팝업을 허용하거나 현재 페이지 주소를 새 탭으로 여세요.');}
  });
  var pointerId=null, px=0, py=0, downX=0, downY=0, changed=false;
  var hasStarted=false;
  var keys=new Set(), raf=0, lastTime=0;
  var lastSync=0;
  function message(s){status.textContent=s;status.style.display='block';}
  function showLook(yes){layer.style.display=yes?'block':'none';if(yes)layer.focus({preventScroll:true});}
  function updateSoundButton(){
    if(!ready||!player)return;
    try{soundBtn.textContent=player.isMuted()?'🔇 소리 켜기':'🔊 소리 끄기';}
    catch(e){soundBtn.textContent='🔊 소리';}
  }
  soundBtn.addEventListener('click',function(){
    if(!ready||!player){message('플레이어 로딩 중입니다.');return;}
    try{
      if(player.isMuted()){player.unMute();if(player.getVolume()===0)player.setVolume(70);}
      else{player.mute();}
      updateSoundButton();
    }catch(e){message('소리 제어가 제한되었습니다.');}
  });
  function updateFullscreenButton(){
    fullscreenBtn.textContent=document.fullscreenElement?'⛶ 전체화면 종료':'⛶ 전체화면';
  }
  fullscreenBtn.addEventListener('click',function(){
    var target=document.documentElement;
    if(document.fullscreenElement){
      if(document.exitFullscreen)document.exitFullscreen().catch(function(){message('전체화면 종료에 실패했습니다.');});
    }else if(target.requestFullscreen){
      target.requestFullscreen().catch(function(){message('LMS 상위 iframe에서 전체화면 권한이 제한되어 있습니다.');});
    }else{message('이 브라우저에서 전체화면 API를 사용할 수 없습니다.');}
  });
  document.addEventListener('fullscreenchange',updateFullscreenButton);
  // The LMS parent iframe's size and fullscreen policy cannot be changed cross-origin.
  // Within its allocated rectangle this player already fills 100% of width and height.
  // Standalone mode lets the user use the browser window as the larger viewport.
  if(new URLSearchParams(location.search).get('standalone')==='1'){
    document.body.classList.add('focus-view');
    focusBtn.textContent='▣ 집중 종료';
    openBtn.style.display='none';
  }
  // Embedded LMS may deny fullscreen if its iframe lacks allowfullscreen / allow="fullscreen".

  function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
  function syncView(){
    if(!ready || !player || typeof player.getSphericalProperties!=='function') return;
    try{
      var p=player.getSphericalProperties();
      if(p && typeof p.yaw==='number' && typeof p.pitch==='number' && typeof p.fov==='number'){
        view.yaw=p.yaw;view.pitch=p.pitch;view.fov=p.fov;spherical=true;
        status.style.display='none';
      }
    }catch(e){}
  }
  function applyView(){
    if(!ready || !player || typeof player.setSphericalProperties!=='function') return;
    try{
      player.setSphericalProperties({yaw:view.yaw,pitch:view.pitch,fov:view.fov,
        enableOrientationSensor:false});
    }catch(e){message('360° 시점 명령을 전달하지 못했습니다.');}
  }
  function turn(dx,dy){
    view.yaw=((view.yaw-dx*.24)%360+360)%360;
    view.pitch=clamp(view.pitch+dy*.24,-90,90);
    applyView();
  }
  function zoom(delta){
    view.fov=clamp(view.fov+delta,30,120);
    applyView();
  }
  function prepare(){
    layer.focus({preventScroll:true});
    if(Date.now()-lastSync>1500){syncView();lastSync=Date.now();}
  }
  layer.addEventListener('pointerdown',function(e){
    if(e.button!==0 && e.pointerType==='mouse')return;
    prepare();pointerId=e.pointerId;px=downX=e.clientX;py=downY=e.clientY;changed=false;
    layer.classList.add('dragging');
    try{layer.setPointerCapture(e.pointerId)}catch(ex){}
    e.preventDefault();
  });
  layer.addEventListener('pointermove',function(e){
    if(pointerId!==e.pointerId)return;
    var dx=e.clientX-px,dy=e.clientY-py;
    px=e.clientX;py=e.clientY;
    if(!changed && Math.hypot(e.clientX-downX,e.clientY-downY)>=7)changed=true;
    if(changed && (dx || dy))turn(dx,dy);
  });
  function stop(e){
    if(pointerId!==e.pointerId)return;
    var tap=!changed && e.type==='pointerup';
    pointerId=null;layer.classList.remove('dragging');
    try{layer.releasePointerCapture(e.pointerId)}catch(ex){}
    if(tap && ready && player){
      try{
        var state=player.getPlayerState();
        if(state===YT.PlayerState.PLAYING || state===YT.PlayerState.BUFFERING){player.pauseVideo();}
        else{player.playVideo();}
      }catch(err){message('재생/일시정지 명령을 전달하지 못했습니다.')}
    }
  }
  layer.addEventListener('pointerup',stop);
  layer.addEventListener('pointercancel',stop);
  layer.addEventListener('wheel',function(e){
    e.preventDefault();prepare();zoom(e.deltaY*.045);
  },{passive:false});
  function normalizeKey(e){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown')return e.key;
    if(e.code==='NumpadAdd'||e.key==='+'||e.key==='='||e.key==='Add')return '+';
    if(e.code==='NumpadSubtract'||e.key==='-'||e.key==='_'||e.key==='Subtract')return '-';
    return null;
  }
  function tick(t){
    if(!keys.size){raf=0;lastTime=0;return;}
    var step=lastTime?Math.min((t-lastTime)/16.7,3):1;
    lastTime=t;
    var dx=0,dy=0;
    if(keys.has('ArrowLeft'))dx-=5*step;
    if(keys.has('ArrowRight'))dx+=5*step;
    if(keys.has('ArrowUp'))dy+=5*step;
    if(keys.has('ArrowDown'))dy-=5*step;
    if(dx||dy)turn(dx,dy);
    if(keys.has('+'))zoom(-1.3*step);
    if(keys.has('-'))zoom(1.3*step);
    raf=requestAnimationFrame(tick);
  }
  window.addEventListener('keydown',function(e){
    var k=normalizeKey(e);if(!k)return;
    e.preventDefault();
    if(!keys.has(k)){keys.add(k);if(!raf)raf=requestAnimationFrame(tick)}
  },true);
  window.addEventListener('keyup',function(e){var k=normalizeKey(e);if(k){keys.delete(k);e.preventDefault()}},true);
  window.addEventListener('blur',function(){keys.clear();});
  // Leave a generous uncovered strip for YouTube's native bottom controls.
  // Additional top-right buttons are outside the drag layer and respond to direct user gestures.
  // No automatic sound unmute or playback requests: preserve working click-to-play audio.
  window.onYouTubeIframeAPIReady=function(){
    player=new YT.Player('player',{
      width:'100%',height:'100%',videoId:VIDEO_ID,
      playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,fs:1},
      events:{
        onReady:function(){ready=true;updateSoundButton();setTimeout(syncView,300);},
        onStateChange:function(e){
          if(e.data===1){hasStarted=true;syncView();showLook(true);updateSoundButton();}
          else if(e.data===2){showLook(hasStarted);syncView();updateSoundButton();}
          else if(e.data===0 || e.data===5){showLook(false);syncView();}
        },
        onError:function(e){message('유튜브 플레이어 오류 코드: '+e.data);}
      }
    });
  };
  var api=document.createElement('script');
  api.src='https://www.youtube.com/iframe_api';
  api.onerror=function(){message('유튜브 API를 불러오지 못했습니다.');};
  document.head.appendChild(api);
})();
</script>
</body>
</html>
